<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Single Solution — mockups</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				font-family: system-ui, sans-serif;
				background: #f0f3f7;
				color: #0b1220;
				padding: 2.5rem 1.5rem;
			}
			h1 {
				margin: 0 0 0.4rem;
				font-size: 1.8rem;
				letter-spacing: -0.03em;
			}
			.sub {
				color: #5a6475;
				max-width: 36rem;
				margin: 0 0 1.75rem;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
				gap: 0.85rem;
				max-width: 48rem;
			}
			a.card {
				display: block;
				padding: 1.2rem;
				border: 1px solid rgba(11, 18, 32, 0.1);
				border-radius: 0.35rem;
				text-decoration: none;
				color: inherit;
				background: #fff;
			}
			a.card:hover {
				border-color: #0f766e;
			}
			.n {
				font-size: 0.65rem;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: #0f766e;
				font-weight: 700;
			}
			a.card h3 {
				margin: 0.4rem 0 0.3rem;
				font-size: 1.1rem;
			}
			a.card p {
				margin: 0;
				font-size: 0.88rem;
				color: #5a6475;
				line-height: 1.4;
			}
		</style>
	</head>
	<body>
		<h1>Marketing mockups</h1>
		<p class="sub">Unite = website source of truth. Portal kit = same dialect for console / dashboards.</p>
		<div class="grid">
			<a class="card" href="./30-unite/index.html">
				<div class="n">30 · Unite</div>
				<h3>Marketing site</h3>
				<p>Light Gridlock × Rift × Frost — expressive.</p>
			</a>
			<a class="card" href="./40-portal-kit/index.html">
				<div class="n">40 · Portal kit</div>
				<h3>Console dialect</h3>
				<p>Tokens + shell + Operate phone — quieter, denser.</p>
			</a>
		</div>
	</body>
</html>
