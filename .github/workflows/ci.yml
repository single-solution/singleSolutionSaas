name: CI

on:
   push:
      branches: [main, platform-v1]
   pull_request:

permissions:
   contents: read

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

jobs:
   # repository-wide: the root files' format and the production dependency audit
   root:
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - uses: actions/checkout@v4
         - uses: pnpm/action-setup@v4
         - uses: actions/setup-node@v4
           with:
              node-version-file: .nvmrc
              cache: pnpm
         - run: pnpm install --frozen-lockfile
         - run: pnpm exec prettier --check .
         - run: pnpm audit --prod --audit-level high

   # every unit on its own (PLAN F.17): its own check (format, lint, typecheck, tests with coverage thresholds),
   # plus `next build` for deployables and `ss app validate` for products. The Portal's check includes
   # `runtime:check` (node scripts/build-delivery-runtime.js --check).
   units:
      runs-on: ubuntu-latest
      outputs:
         list: ${{ steps.find.outputs.list }}
      steps:
         - uses: actions/checkout@v4
         - id: find
           # every folder with a package.json is a unit; new products join CI automatically
           run: echo "list=$(ls -d packages/*/ platform/ products/*/ e2e/ | sed 's:/$::' | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

   unit:
      name: ${{ matrix.unit }}
      needs: units
      runs-on: ubuntu-latest
      timeout-minutes: 20
      strategy:
         fail-fast: false
         matrix:
            unit: ${{ fromJson(needs.units.outputs.list) }}
      steps:
         - uses: actions/checkout@v4
         - uses: pnpm/action-setup@v4
         - uses: actions/setup-node@v4
           with:
              node-version-file: .nvmrc
              cache: pnpm
         - run: pnpm install --frozen-lockfile
         - run: pnpm check
           working-directory: ${{ matrix.unit }}
         - run: pnpm build
           if: matrix.unit == 'platform' || startsWith(matrix.unit, 'products/')
           working-directory: ${{ matrix.unit }}
         - run: pnpm validate
           if: startsWith(matrix.unit, 'products/')
           working-directory: ${{ matrix.unit }}
