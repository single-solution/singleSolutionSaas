name: CI

on:
   push:
      branches: [main, platform-v1]
   pull_request:

permissions:
   contents: read

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

jobs:
   # repository-wide: the root files' format and the production dependency audit
   root:
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
         - uses: actions/checkout@v4
         - uses: pnpm/action-setup@v4
         - uses: actions/setup-node@v4
           with:
              node-version-file: .nvmrc
              cache: pnpm
         - run: pnpm install --frozen-lockfile
         - run: pnpm exec prettier --check .
         - run: pnpm audit --prod --audit-level high

   # every unit on its own (PLAN F.17): its own check (format, lint, typecheck, tests with coverage thresholds),
   # plus `next build` for deployables and `ss app validate` for products. The Portal's check includes
   # `runtime:check` (node scripts/build-delivery-runtime.js --check).
   unit:
      name: ${{ matrix.unit }}
      runs-on: ubuntu-latest
      timeout-minutes: 20
      strategy:
         fail-fast: false
         matrix:
            unit:
               - packages/config
               - packages/contracts
               - packages/rules
               - packages/entitlements
               - packages/protocol
               - packages/net
               - packages/app-kit
               - packages/web
               - packages/ui
               - packages/cli
               - platform
               - products/alerts
               - products/chatbot
               - products/coupons
               - products/deals
               - products/loyalty
               - products/reviews
               - products/signups
               - e2e
      steps:
         - uses: actions/checkout@v4
         - uses: pnpm/action-setup@v4
         - uses: actions/setup-node@v4
           with:
              node-version-file: .nvmrc
              cache: pnpm
         - run: pnpm install --frozen-lockfile
         - run: pnpm check
           working-directory: ${{ matrix.unit }}
         - run: pnpm build
           if: matrix.unit == 'platform' || startsWith(matrix.unit, 'products/')
           working-directory: ${{ matrix.unit }}
         - run: pnpm validate
           if: startsWith(matrix.unit, 'products/')
           working-directory: ${{ matrix.unit }}
